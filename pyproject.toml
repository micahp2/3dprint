[project]
name = "printdesk"
version = "0.1.0"
description = "Parametric CAD + slicing + print queue for AI agents (Bambu P1S)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "build123d>=0.9",
  "pydantic>=2.7",
  "trimesh>=4.4",
  "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
printdesk = "printdesk.cli:main"
